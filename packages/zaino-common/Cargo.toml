[package]
name = "zaino-common"
description = "Common types and configurations shared across Zaino crates."
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
version = "0.5.2"

[dependencies]
# Zebra
zebra-chain = { workspace = true }

# The network type an address encoding is read against. A network kind names
# one; zebra's `Network` cannot, since it has no variant for the SWARM
# production network.
zcash_protocol = { workspace = true }

# Serialization
serde = { workspace = true, features = ["derive"] }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-tree = { workspace = true }
time = { workspace = true }
rustls = { version = "0.23", default-features = false, features = [
    "aws_lc_rs",
    "prefer-post-quantum",
] }

[dev-dependencies]
# Parsing an address string, to check which network kind it can reach.
zcash_address = { workspace = true }
